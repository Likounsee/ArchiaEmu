[package]
name = "archiaemu-app"
version = "0.1.0"
description = "Minimal terminal host application for ArchiaEmu"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "archiaemu"
path = "src/main.rs"
required-features = ["game-boy-color-module"]

[features]
default = []
game-boy-color-module = ["dep:archiaemu-game-boy"]

[dependencies]
archiaemu-core = { version = "0.1.0", path = "../archiaemu-core" }
archiaemu-game-boy = { package = "archiaemu-game-boy-color", version = "0.1.0", path = "../archiaemu-game-boy", optional = true }

[dev-dependencies]
archiaemu-game-boy = { package = "archiaemu-game-boy-color", version = "0.1.0", path = "../archiaemu-game-boy" }
