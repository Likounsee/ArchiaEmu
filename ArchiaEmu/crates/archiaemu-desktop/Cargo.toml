[package]
name = "archiaemu-desktop"
version = "0.1.0"
description = "Experimental native desktop frontend for ArchiaEmu"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/Likounsee/ArchiaEmu"

[features]
# Console cores are optional modules; a fresh desktop build contains no console by default.
default = []
game-boy-color-module = ["dep:archiaemu-game-boy"]

[dependencies]
archiaemu-app = { version = "0.1.0", path = "../archiaemu-app" }
archiaemu-core = { version = "0.1.0", path = "../archiaemu-core" }
archiaemu-game-boy = { package = "archiaemu-game-boy-color", version = "0.1.0", path = "../archiaemu-game-boy", optional = true }
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ed25519-dalek = "=2.1.1"
rfd = "=0.14.1"
rodio = { version = "=0.17.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sys-locale = "=0.3.2"
ureq = "=2.12.1"
