name: ArchiaEmu CI

on:
  push:
    branches: [ArchiaEmu]
  pull_request:
    branches: [ArchiaEmu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archiaemu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ArchiaEmu
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ArchiaEmu -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Check package contents
        run: cargo package --workspace --locked --no-verify
      - name: Check desktop prototype formatting
        run: cargo fmt --manifest-path crates/archiaemu-desktop/Cargo.toml -- --check
      - name: Compile desktop prototype
        run: cargo check --manifest-path crates/archiaemu-desktop/Cargo.toml --all-targets
      - name: Test desktop prototype
        run: cargo test --manifest-path crates/archiaemu-desktop/Cargo.toml --all-targets
      - name: Run Clippy (desktop prototype, Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path crates/archiaemu-desktop/Cargo.toml --all-targets -- -D warnings
      - name: Check desktop package contents
        run: cargo package --manifest-path crates/archiaemu-desktop/Cargo.toml --list --allow-dirty
      - name: Run Clippy (Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Audit dependencies and licenses
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ArchiaEmu/Cargo.toml
          command: check
      - name: Audit desktop prototype dependencies and licenses
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ArchiaEmu/crates/archiaemu-desktop/Cargo.toml
          command: check
