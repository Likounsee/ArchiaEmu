name: Windows installer

on:
  push:
    branches: [ArchiaEmu]
    tags: ["v*"]
    paths:
      - "ArchiaEmu/crates/**"
      - "ArchiaEmu/Cargo.toml"
      - "ArchiaEmu/Cargo.lock"
      - "ArchiaEmu/packaging/windows/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ArchiaEmu/crates/archiaemu-desktop -> ArchiaEmu/crates/archiaemu-desktop/target

      - name: Build desktop executable with static MSVC runtime
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path ArchiaEmu/crates/archiaemu-desktop/Cargo.toml

      - name: Stage application and determine version
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content "ArchiaEmu/crates/archiaemu-desktop/Cargo.toml" -Raw
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not read desktop package version from Cargo.toml" }
          $version = $match.Groups[1].Value
          $exe = "ArchiaEmu/crates/archiaemu-desktop/target/release/archiaemu-desktop.exe"
          if (!(Test-Path $exe)) {
            throw "Expected desktop executable was not produced: $exe"
          }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/stage" | Out-Null
          Copy-Item $exe "$env:GITHUB_WORKSPACE/stage/archiaemu-desktop.exe"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          & $iscc "/DAppVersion=${{ steps.stage.outputs.version }}" "/DStageDir=$env:GITHUB_WORKSPACE/stage" "/O$env:GITHUB_WORKSPACE/dist" "ArchiaEmu/packaging/windows/ArchiaEmu.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify installer output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE/dist" -Filter "ArchiaEmu-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "Installer output is missing." }
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small ($($installer.Length) bytes)." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "Verified installer: $($installer.FullName) ($($installer.Length) bytes)"
          Write-Host "SHA-256: $hash"

      - name: Smoke-test install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE/dist" -Filter "ArchiaEmu-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "Installer output is missing for smoke test." }
          $installDir = Join-Path $env:RUNNER_TEMP "ArchiaEmu Installer Smoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=`"$installDir`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)." }
          $installedExe = Join-Path $installDir "archiaemu-desktop.exe"
          if (!(Test-Path $installedExe)) {
            Get-ChildItem -Force $installDir -ErrorAction SilentlyContinue | Format-List FullName, Length
            throw "Installed desktop executable is missing at expected path: $installedExe"
          }
          # Launch from the isolated install directory, not the repository or Cargo target tree.
          # Capture startup output so failures on clean runners are diagnosable.
          $stdout = Join-Path $env:RUNNER_TEMP "archiaemu-installed-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "archiaemu-installed-stderr.log"
          Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "Installed application stdout:"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "Installed application stderr:"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Installed desktop executable exited during its startup smoke test (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force
          Wait-Process -Id $app.Id -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller executable is missing." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path $installedExe) { throw "Installed executable remains after uninstall." }
          Write-Host "Silent install and uninstall smoke test passed."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchiaEmu-Windows-x64-${{ steps.stage.outputs.version }}
          path: |
            dist/ArchiaEmu-Setup-*.exe
            dist/ArchiaEmu-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer on tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ArchiaEmu-Setup-*.exe
            dist/ArchiaEmu-Setup-*.exe.sha256
