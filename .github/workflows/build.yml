name: Build and test

on:
  push:
    branches: [main, ArchiaEmu]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S ArchiaEmu -B ArchiaEmu/build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build ArchiaEmu/build --parallel

      - name: Test
        run: ctest --test-dir ArchiaEmu/build --output-on-failure
