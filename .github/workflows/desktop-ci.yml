name: Desktop quality gates

on:
  push:
    branches: [ArchiaEmu]
    paths:
      - "ArchiaEmu/crates/archiaemu-desktop/**"
      - "ArchiaEmu/crates/archiaemu-app/**"
      - "ArchiaEmu/crates/archiaemu-core/**"
      - "ArchiaEmu/crates/archiaemu-game-boy/**"
      - "ArchiaEmu/Cargo.toml"
      - "ArchiaEmu/Cargo.lock"
      - "ArchiaEmu/docs/**"
      - "README.md"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [ArchiaEmu]
    paths:
      - "ArchiaEmu/crates/archiaemu-desktop/**"
      - "ArchiaEmu/crates/archiaemu-app/**"
      - "ArchiaEmu/crates/archiaemu-core/**"
      - "ArchiaEmu/crates/archiaemu-game-boy/**"
      - "ArchiaEmu/Cargo.toml"
      - "ArchiaEmu/Cargo.lock"
      - "ArchiaEmu/docs/**"
      - "README.md"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Desktop checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --manifest-path ArchiaEmu/Cargo.toml --all -- --check

      - name: Check desktop formatting
        run: cargo fmt --manifest-path ArchiaEmu/crates/archiaemu-desktop/Cargo.toml -- --check

      - name: Test shared workspace
        run: cargo test --manifest-path ArchiaEmu/Cargo.toml --workspace --locked

      - name: Lint shared workspace
        run: cargo clippy --manifest-path ArchiaEmu/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test desktop and its dependencies
        run: cargo test --manifest-path ArchiaEmu/crates/archiaemu-desktop/Cargo.toml

      - name: Lint desktop and its dependencies
        run: cargo clippy --manifest-path ArchiaEmu/crates/archiaemu-desktop/Cargo.toml --all-targets -- -D warnings

      - name: Generate warning-free workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path ArchiaEmu/Cargo.toml --workspace --no-deps --locked
