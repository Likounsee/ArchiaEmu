name: Desktop quality gates

on:
  push:
    branches: [ArchiaEmu]
    paths:
      - "ArchiaEmu/crates/archiaemu-desktop/**"
      - "ArchiaEmu/crates/archiaemu-app/**"
      - "ArchiaEmu/crates/archiaemu-core/**"
      - "ArchiaEmu/crates/archiaemu-game-boy/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [ArchiaEmu]
    paths:
      - "ArchiaEmu/crates/archiaemu-desktop/**"
      - "ArchiaEmu/crates/archiaemu-app/**"
      - "ArchiaEmu/crates/archiaemu-core/**"
      - "ArchiaEmu/crates/archiaemu-game-boy/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop checks (${{ matrix.os }${{)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }${{
    steps:
      - name: Check out ArchiaEmu branch
        uses: actions/checkout@v4
        with:
          ref: ArchiaEmu

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check desktop formatting
        run: cargo fmt --manifest-path ArchiaEmu/crates/archiaemu-desktop/Cargo.toml -- --check

      - name: Test desktop and application dependencies
        run: cargo test --manifest-path ArchiaEmu/crates/archiaemu-desktop/Cargo.toml

      - name: Lint desktop and application dependencies
        run: cargo clippy --manifest-path ArchiaEmu/crates/archiaemu-desktop/Cargo.toml --all-targets -- -D warnings
