[workspace]
resolver = "2"
members = [
    "crates/peaceemu-core",
    "crates/peaceemu-app",
    "crates/peaceemu-game-boy",
    "crates/peaceemu-windows-durability",
]
exclude = ["crates/peaceemu-desktop"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/Likounsee/PeaceEmu"
